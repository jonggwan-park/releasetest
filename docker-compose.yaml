version: '3.8'

services:
  web:
    build:
      context: ./steamate
    volumes:
      - static_volume:/app/static 
    env_file:
      - .env
    ports:
      - "8080:8000"
    command: >
      sh -c "until nc -z $DATABASE_HOST 5432; do
      echo 'Waiting for DB...';
      sleep 2;
      done;
      python manage.py migrate;
      gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    networks:
      - steamate-network



  frontend:
    build:
      context: ./frontend # 프론트엔드 Dockerfile이 있는 폴더
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://web:8000
    volumes:
      - frontend_build:/app/build
      - static_volume:/usr/share/nginx/html/static

    networks:
      - steamate-network
    depends_on:
      - web
    
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      frontend:
        condition: service_completed_successfully
    networks:
      - steamate-network
    volumes:
      - static_volume:/usr/share/nginx/html/static
      - frontend_build:/usr/share/nginx/html
networks:
  steamate-network:
    driver: bridge

volumes:
  static_volume:
  frontend_build: